# One colour (blue or green) of the API. deploy.sh runs it as its own project:
#   COLOR=green IMAGE_TAG=<tag> docker compose -p bocardo-green -f api.compose.yml up -d --scale api=N
# Containers are named bocardo-<colour>-api-<n>; Caddy reaches them by name on the bocardo_edge network.
# No ports are published: only Caddy is reachable from the internet.

services:
  api:
    image: bocardo-api:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ${BOCARDO_HOME:-/opt/bocardo}/shared/api.env
    # these win over anything in api.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      RELEASE_COLOR: ${COLOR:?COLOR is required}
      RELEASE_TAG: ${IMAGE_TAG}
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-384}
    labels:
      app.bocardo.color: ${COLOR}
      app.bocardo.release: ${IMAGE_TAG}
    init: true
    restart: unless-stopped
    # SIGTERM → Nest shutdown hooks → Fastify finishes in-flight requests
    stop_grace_period: 30s
    expose:
      - "4000"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-512m}
          cpus: "${API_CPUS:-1.0}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    external: true
    name: bocardo_edge
